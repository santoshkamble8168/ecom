worker_processes auto;

events {
  worker_connections 1024;
}

http {
  gzip on;
  gzip_types text/plain application/json application/javascript text/css application/xml image/svg+xml;
  gzip_min_length 512;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Local Docker listens on HTTP. In production, terminate TLS at the load
  # balancer (or add a listen 443 ssl server) and 301 HTTP → HTTPS there.
  # The Next.js storefront middleware also 308-redirects HTTP → HTTPS when
  # NODE_ENV=production, using X-Forwarded-Proto from this proxy.
  server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_next/static/ {
      proxy_pass http://storefront:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
      limit_except GET HEAD POST PUT PATCH DELETE OPTIONS { deny all; }
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin:3001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "private, no-store" always;
    }

    location / {
      proxy_pass http://storefront:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
